name: Docker Project Deploy

on:
  push:
    branches:
      - main

jobs:
  build_and_push_to_docker_hub:
      name: Push Docker image to DockerHub
      runs-on: ubuntu-latest
      steps:
        - name: Check out the repo
          uses: actions/checkout@v3
        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v2
        - name: Login to Docker
          uses: docker/login-action@v2
          with:
            username: ${{ secrets.DOCKER_USER }}
            password: ${{ secrets.DOCKER_PASSWORD }}
        - name: Push Backend to DockerHub
          uses: docker/build-push-action@v4
          with:
            context: ./backend/
            push: true
            tags: ${{ secrets.DOCKER_USER }}/docker-project-backend:latest
        - name: Push Frontend to DockerHub
          uses: docker/build-push-action@v4
          with:
            context: ./frontend/
            push: true
            tags: ${{ secrets.DOCKER_USER }}/docker-project-frontend:latest
        # added: an immutable per-commit tag next to the moving "latest"
        - name: Push Backend to DockerHub (sha tag)
          uses: docker/build-push-action@v4
          with:
            context: ./backend/
            push: true
            build-args: VERSION=${{ github.sha }}
            tags: ${{ secrets.DOCKER_USER }}/docker-project-backend:${{ github.sha }}
        - name: Push Frontend to DockerHub (sha tag)
          uses: docker/build-push-action@v4
          with:
            context: ./frontend/
            push: true
            tags: ${{ secrets.DOCKER_USER }}/docker-project-frontend:${{ github.sha }}

  run-with-docker-compose:
    name: Push Docker image to DockerHub
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Build via Docker Compose
        uses: hoverkraft-tech/compose-action@v2.2.0
      # added: the stack must answer, with two backend replicas behind nginx
      - name: Smoke test (scaled backend, health, API through nginx)
        run: |
          docker compose up -d --wait --scale backend=2
          docker compose ps
          curl -fsS http://localhost/healthz
          curl -fsS http://localhost/api/health
          curl -fsS http://localhost/api/products | head -c 200; echo
          curl -fsS -o /dev/null -w 'frontend %{http_code}\n' http://localhost/
      - name: Compose logs on failure
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v

  # added: vulnerability + secret scan of the pushed images.
  # First step prints everything (all severities, unfixed included) for the log,
  # second step fails the pipeline on CRITICAL/HIGH.
  security_scan:
    name: Trivy image scan
    runs-on: ubuntu-latest
    needs: build_and_push_to_docker_hub
    strategy:
      fail-fast: false
      matrix:
        image: [docker-project-backend, docker-project-frontend]
    steps:
      - name: Full report (all severities, informational)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ secrets.DOCKER_USER }}/${{ matrix.image }}:latest
          scanners: vuln,secret,misconfig
          format: table
          exit-code: "0"
      - name: Gate on CRITICAL/HIGH
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ secrets.DOCKER_USER }}/${{ matrix.image }}:latest
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          exit-code: "1"
